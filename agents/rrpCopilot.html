<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RRP Copilot — 자체정상화계획 초안 생성 시스템</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --ink:#111621;          /* 본문 잉크 */
  --ink-2:#4A5468;        /* 보조 텍스트 */
  --ink-3:#8A93A6;        /* 캡션 */
  --paper:#F4F6F9;        /* 앱 배경 */
  --surface:#FFFFFF;
  --surface-2:#FAFBFD;
  --line:#E2E7EF;
  --line-2:#CFD6E2;
  --brand:#1F3FE0;        /* 잉크블루 */
  --brand-soft:#EEF1FE;
  --brand-deep:#152BA0;
  --new:#0B7A63;          /* 신규 */
  --new-soft:#E4F5F0;
  --chg:#9A6300;          /* 수정 */
  --chg-soft:#FDF2DE;
  --del:#AE2233;          /* 삭제 */
  --del-soft:#FCEBED;
  --ok:#0B7A63;
  --warn:#9A6300;
  --r-s:6px; --r-m:10px; --r-l:16px;
  --sans:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
  --serif:'Gowun Batang','Nanum Myeongjo',serif;
  --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
  --shadow:0 1px 2px rgba(17,22,33,.04),0 8px 24px -12px rgba(17,22,33,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.6}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ SHELL ============ */
.app{display:grid;grid-template-columns:248px 1fr;height:100vh;overflow:hidden}

/* Sidebar */
.side{background:var(--ink);color:#C8CEDC;display:flex;flex-direction:column;overflow:hidden}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-mark{display:flex;align-items:center;gap:9px}
.brand-dot{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#4C6BFF,#1F3FE0);display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;letter-spacing:-.5px}
.brand-name{color:#fff;font-weight:700;font-size:15px;letter-spacing:-.3px}
.brand-sub{font-size:10.5px;color:#6F7A91;margin-top:5px;letter-spacing:.06em;font-family:var(--mono)}
.nav{flex:1;overflow-y:auto;padding:14px 10px 20px}
.nav::-webkit-scrollbar{width:6px}
.nav::-webkit-scrollbar-thumb{background:#2B3346;border-radius:3px}
.nav-label{font-size:10px;color:#5D6885;letter-spacing:.13em;font-weight:700;padding:12px 8px 7px}
.nav-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border-radius:7px;font-size:13px;color:#B6BECE;text-align:left;transition:background .12s,color .12s}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.on{background:var(--brand);color:#fff;font-weight:600}
.nav-item .ic{width:15px;text-align:center;font-size:12px;opacity:.9}
.ch-item{display:grid;grid-template-columns:34px 1fr 14px;align-items:center;gap:0;width:100%;padding:7px 9px;border-radius:7px;text-align:left;transition:background .12s}
.ch-item:hover{background:rgba(255,255,255,.06)}
.ch-item.on{background:rgba(76,107,255,.18);box-shadow:inset 2px 0 0 var(--brand)}
.ch-id{font-family:var(--mono);font-size:10.5px;color:#6F7A91;font-weight:600}
.ch-item.on .ch-id{color:#93A8FF}
.ch-nm{font-size:12.5px;color:#B6BECE;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-item.on .ch-nm{color:#fff;font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:#39415A;flex:0 0 auto}
.dot.draft{background:var(--chg)}
.dot.done{background:#19C39C}
.side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:10.5px;color:#5D6885;font-family:var(--mono)}

/* Main */
.main{display:flex;flex-direction:column;overflow:hidden;background:var(--paper)}
.topbar{height:56px;flex:0 0 56px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px}
.org-pick{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;background:var(--surface-2)}
.org-pick select{border:none;background:none;font-weight:700;font-size:13.5px;letter-spacing:-.2px;cursor:pointer}
.yr{font-family:var(--mono);font-size:12px;color:var(--ink-2);border-left:1px solid var(--line-2);padding-left:9px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 8px;border-radius:99px;font-weight:600;letter-spacing:-.1px}
.chip.demo{background:var(--chg-soft);color:var(--chg)}
.chip.rule{background:var(--brand-soft);color:var(--brand-deep);font-family:var(--mono);font-size:10.5px}
.spacer{flex:1}
.user{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2)}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand-deep);display:grid;place-items:center;font-size:11px;font-weight:700}
.scroll{flex:1;overflow-y:auto}
.wrap{max-width:1080px;margin:0 auto;padding:28px 28px 80px}
.wrap.wide{max-width:1240px}

/* ============ TYPO ============ */
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--ink-3);font-weight:600;margin-bottom:8px}
h1{font-size:25px;font-weight:800;letter-spacing:-.7px;line-height:1.25}
h2{font-size:16px;font-weight:700;letter-spacing:-.35px}
h3{font-size:13.5px;font-weight:700;letter-spacing:-.2px}
.lede{color:var(--ink-2);font-size:13.5px;margin-top:8px;max-width:62ch}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;margin:30px 0 12px;gap:16px}
.sec-head p{font-size:12px;color:var(--ink-3);margin-top:3px}

/* ============ COMPONENTS ============ */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow)}
.pad{padding:20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:9px;font-size:13px;font-weight:600;transition:.14s;border:1px solid transparent;letter-spacing:-.2px}
.btn.pri{background:var(--brand);color:#fff}
.btn.pri:hover{background:var(--brand-deep)}
.btn.pri:disabled{background:#C3CADB;cursor:not-allowed}
.btn.gho{border-color:var(--line-2);background:var(--surface);color:var(--ink)}
.btn.gho:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn.sm{padding:6px 11px;font-size:12px;border-radius:7px}
.btn.dark{background:var(--ink);color:#fff}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2.5px 8px;border-radius:5px;letter-spacing:-.1px}
.tag.n{background:var(--new-soft);color:var(--new)}
.tag.c{background:var(--chg-soft);color:var(--chg)}
.tag.d{background:var(--del-soft);color:var(--del)}
.tag.g{background:#F0F2F6;color:var(--ink-2)}
.tag.b{background:var(--brand-soft);color:var(--brand-deep)}
.bar{height:5px;background:#EDF0F5;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar>i.ok{background:#19C39C}
table{width:100%;border-collapse:collapse}
th{font-size:11px;color:var(--ink-3);font-weight:700;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);letter-spacing:-.1px;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:12.5px;vertical-align:top}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}

/* KPI */
.kpi{padding:16px 18px}
.kpi .k{font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:-.1px}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-1.2px;margin:6px 0 2px}
.kpi .s{font-size:11.5px;color:var(--ink-2)}

/* Stepper */
.steps{display:flex;align-items:center;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:6px;margin-bottom:18px}
.step{flex:1;display:flex;align-items:center;gap:9px;padding:10px 14px;border-radius:11px;transition:.15s;text-align:left}
.step:hover:not(.on){background:var(--surface-2)}
.step.on{background:var(--ink);color:#fff}
.step-n{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;font-weight:700;background:#EDF0F5;color:var(--ink-2);flex:0 0 auto}
.step.on .step-n{background:rgba(255,255,255,.2);color:#fff}
.step.done .step-n{background:#19C39C;color:#fff}
.step-t{font-size:12.5px;font-weight:600;letter-spacing:-.2px}
.step-d{font-size:10.5px;opacity:.65;margin-top:1px}
.step-sep{width:14px;height:1px;background:var(--line-2);flex:0 0 auto}

/* Input rows */
.inrow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.inrow:last-child{border-bottom:none}
.inrow.filled{background:linear-gradient(90deg,rgba(11,122,99,.045),transparent 40%)}
.in-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px}
.in-name{font-size:13px;font-weight:600;letter-spacing:-.2px;display:flex;align-items:center;gap:7px}
.req{color:var(--del);font-size:11px}
.src{font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.filechip{display:inline-flex;align-items:center;gap:6px;background:var(--new-soft);color:var(--new);border-radius:6px;padding:4px 9px;font-size:11.5px;font-weight:600;font-family:var(--mono)}
.valbox{display:flex;align-items:center;gap:6px}
.valbox input{width:104px;border:1px solid var(--line-2);border-radius:7px;padding:7px 9px;font-family:var(--mono);font-size:12.5px;text-align:right;background:var(--surface)}
.valbox input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.unit{font-size:11.5px;color:var(--ink-3);width:36px}
.prev{font-size:11px;color:var(--ink-3);font-family:var(--mono);min-width:96px;text-align:right}

/* Generating */
.gen{background:var(--ink);color:#D6DBE7;border-radius:var(--r-l);padding:24px;font-family:var(--mono);font-size:12px;line-height:2}
.gen .ln{opacity:0;transform:translateY(3px);animation:up .3s forwards}
@keyframes up{to{opacity:1;transform:none}}
.gen .ok{color:#19C39C}
.gen .hl{color:#93A8FF}

/* Document */
.docwrap{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow);overflow:hidden}
.doc-bar{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.doc-body{padding:30px 34px 38px}
.doc-title{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:-.3px;padding-bottom:12px;border-bottom:2px solid var(--ink);margin-bottom:22px}
.p{position:relative;padding-left:26px;margin-bottom:16px;font-family:var(--serif);font-size:14.5px;line-height:2.05;letter-spacing:-.1px;color:#1A2030;transition:opacity .2s}
.p .gut{position:absolute;left:0;top:11px;width:14px;font-family:var(--mono);font-size:9px;font-weight:700;color:var(--ink-3);letter-spacing:-.5px}
.p .gut i{display:block;width:3px;height:100%;position:absolute;left:5px;top:0}
.p.pnew{border-left:2px solid var(--new);margin-left:-2px;padding-left:28px}
.p.pchg{border-left:2px solid var(--chg);margin-left:-2px;padding-left:28px}
.p .sub{font-family:var(--sans);font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:-.2px;display:block;margin-bottom:2px}
.d{border-radius:3px;padding:1px 2px;cursor:pointer;transition:.12s;text-decoration:none;border-bottom:1.5px solid transparent}
.d-new{background:var(--new-soft);border-bottom-color:var(--new);color:#064F40}
.d-chg{background:var(--chg-soft);border-bottom-color:var(--chg);color:#6B4400}
.d-del{background:var(--del-soft);color:var(--del);text-decoration:line-through;opacity:.7}
.d-same{border-bottom:1px dotted var(--line-2)}
.d:hover{filter:brightness(.96)}
.d.act{box-shadow:0 0 0 2px var(--brand);background:var(--brand-soft);border-bottom-color:var(--brand)}
.dimmed{opacity:.22}
.doc-tbl{margin:8px 0 20px 26px;border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;font-family:var(--sans)}
.doc-tbl caption{caption-side:top;text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-2);padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.doc-tbl td,.doc-tbl th{font-size:11.5px;padding:8px 12px}

/* Evidence panel */
.ev{position:sticky;top:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow);overflow:hidden}
.ev-h{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:#fff}
.ev-h .t{font-size:12.5px;font-weight:700;letter-spacing:-.2px}
.ev-h .s{font-size:10px;color:#8A93A6;font-family:var(--mono);margin-top:1px}
.ev-b{padding:16px;max-height:calc(100vh - 230px);overflow-y:auto}
.ev-empty{text-align:center;padding:34px 16px;color:var(--ink-3);font-size:12px;line-height:1.7}
.ev-empty .big{font-size:22px;margin-bottom:10px;opacity:.5}
.ev-row{padding:10px 0;border-bottom:1px solid var(--line)}
.ev-row:last-child{border-bottom:none}
.ev-k{font-size:10.5px;color:var(--ink-3);font-weight:700;letter-spacing:.02em;margin-bottom:3px}
.ev-v{font-size:12.5px;color:var(--ink);word-break:break-all}
.ev-v.m{font-family:var(--mono);font-size:12px}
.delta{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px;margin:4px 0 10px}
.delta .a{font-family:var(--mono);font-size:13px;color:var(--ink-3);text-decoration:line-through}
.delta .arw{color:var(--ink-3);font-size:11px}
.delta .b{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--ink)}
.trace{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);background:var(--surface-2);border:1px dashed var(--line-2);border-radius:7px;padding:9px 10px;line-height:1.75;word-break:break-all}

/* Checklist */
.chk{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.chk:last-child{border-bottom:none}
.chk input{margin-top:3px;width:15px;height:15px;accent-color:var(--brand);cursor:pointer}
.chk label{font-size:12.5px;cursor:pointer;flex:1}
.chk .h{font-size:11px;color:var(--ink-3);margin-top:2px}
textarea.cmt{width:100%;border:1px solid var(--line-2);border-radius:9px;padding:11px;font-size:12.5px;min-height:74px;resize:vertical;line-height:1.7}
textarea.cmt:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}

/* Rules */
.rule-row{display:grid;grid-template-columns:1fr 150px 84px;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.rule-row:last-child{border-bottom:none}
.rule-row input,.rule-row select{border:1px solid var(--line-2);border-radius:7px;padding:6px 9px;font-family:var(--mono);font-size:12px;width:100%}

/* misc */
.note{background:var(--brand-soft);border:1px solid #D3DBFB;border-radius:var(--r-m);padding:12px 14px;font-size:12px;color:var(--brand-deep);line-height:1.7}
.warnbox{background:var(--chg-soft);border:1px solid #F0DFB8;border-radius:var(--r-m);padding:12px 14px;font-size:12px;color:#6B4400;line-height:1.7}
.trig{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.trig:last-child{border-bottom:none}
.trig .lv{width:52px;text-align:center;font-size:10px;font-weight:700;padding:3px 0;border-radius:5px}
.lv.normal{background:#E9F7F3;color:var(--ok)}
.lv.watch{background:var(--chg-soft);color:var(--chg)}
.lv.alert{background:var(--del-soft);color:var(--del)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:11px;font-size:13px;font-weight:600;box-shadow:0 12px 32px rgba(0,0,0,.24);transition:transform .3s cubic-bezier(.2,.9,.3,1.2);z-index:99;display:flex;align-items:center;gap:9px}
.toast.show{transform:translateX(-50%) translateY(0)}
@media(max-width:1180px){.docwrap{grid-template-columns:1fr}.ev{position:relative}}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{display:none}.g4,.g3,.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <!-- ========== SIDEBAR ========== -->
  <aside class="side">
    <div class="brand">
      <div class="brand-mark">
        <div class="brand-dot">R</div>
        <div class="brand-name">RRP Copilot</div>
      </div>
      <div class="brand-sub">RECOVERY PLAN DRAFTING SUITE</div>
    </div>
    <nav class="nav">
      <div class="nav-label">워크스페이스</div>
      <button class="nav-item" data-view="home"><span class="ic">◈</span>대시보드</button>
      <button class="nav-item" data-view="hub"><span class="ic">▤</span>데이터 허브</button>
      <button class="nav-item" data-view="diff"><span class="ic">⇄</span>변경점 리뷰</button>
      <button class="nav-item" data-view="rules"><span class="ic">⚙</span>기관 로직 설정</button>
      <button class="nav-item" data-view="export"><span class="ic">⤓</span>산출물 생성</button>
      <div class="nav-label">보고서 목차 (지주)</div>
      <div id="chNav"></div>
    </nav>
    <div class="side-foot">DEMO BUILD v0.9 · PwC</div>
  </aside>

  <!-- ========== MAIN ========== -->
  <div class="main">
    <header class="topbar">
      <div class="org-pick">
        <select id="orgSel">
          <option value="woori">우리금융지주</option>
          <option value="kb">KB금융지주</option>
          <option value="shinhan">신한금융지주</option>
          <option value="hana">하나금융지주</option>
          <option value="nh">NH농협금융지주</option>
        </select>
        <span class="yr">FY2026 제출본</span>
      </div>
      <span class="chip rule" id="ruleChip">RULESET · WR-A3</span>
      <span class="chip demo">DEMO DATA</span>
      <div class="spacer"></div>
      <div class="user"><span id="learnState" class="mono" style="font-size:11px;color:var(--ink-3)">학습 완료 · 5개년</span><div class="avatar">JB</div></div>
    </header>
    <div class="scroll" id="scroll">
      <div id="view"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"><span>✓</span><span id="toastMsg"></span></div>

<script>
/* =====================================================================
   DATA MODEL — 지주 제출 RRP 목차 / 목차별 필요정보 / 초안 / 근거

  {st:'same',h:'2.3 외부 상호연계성 평가 기준',x:`외부 상호연계성은 ①중요 금융상품·서비스 ②주요 거래상대방 익스포져 ③제3자 업무 위·수탁의 3개 축으로 평가하였다. 이 중 중요 금융상품·서비스의 시장점유율 임계치는 <D e="e5" k="same">대체가능성 평가 결과가 '보통' 이상인 경우 10%, '낮음'인 경우 5%를 적용</D>하였다. 업권별 대표지표는 신용카드업은 신용카드 이용실적, 리스·할부금융업 및 생명보험업은 총자산, 증권업은 자기자본, 부동산신탁업은 영업수익, 자산운용업은 운용자산(AUM)을 사용하였다.`},
  {st:'chg',h:'2.4 평가 결과',tbl:1,x:`2026년 1분기 기준 업권별 대표지표에 따른 시장점유율은 <D e="e6" k="chg">우리카드 8.29%</D>, <D e="e7" k="chg">우리금융캐피탈 5.36%</D>, <D e="e8" k="new">동양생명 3.56%, ABL생명 1.98%</D>로 산출되었다. <D e="e7" k="chg">우리금융캐피탈은 대체가능성 '낮음' 기준 임계치(5%)를 상회하여 외부 상호연계성 관점에서 중요자회사로 판단</D>되었으며, 우리카드는 대체가능성 '보통' 기준 임계치(10%)에 미달하였으나 내부 상호연계성 기준을 충족하여 중요자회사로 선정되었다.`},
  {st:'chg',h:'2.5 핵심기능 식별',x:`핵심기능은 대체가능성과 시스템 영향도의 2축 평가를 통해 <D e="e23" k="chg">총 7개 기능</D>을 식별하였으며, 금년도에는 <D e="e23" k="new">간편지급결제 대행 기능이 신규 편입</D>되었다. 각 핵심기능은 이를 수행하는 자회사와 매핑하여 정상화조치 설계 시 우선 보호 대상으로 관리한다.`}
 ]},

/* =====================================================================
   STATE
   ===================================================================== */
const S={
  view:'home', ch:null, step:1, org:'woori',
  filled:{},      // chId -> Set of input idx
  gen:{},         // chId -> true (초안 생성됨)
  conf:{},        // chId -> true (확정)
  onlyDiff:false, actEv:null
};
CH.forEach(c=>{
  S.filled[c.id]=new Set();
  c.inputs.forEach((it,i)=>{ if(it.f||it.v) S.filled[c.id].add(i); });
});
// 데모 시작 상태: G01~G02는 초안 생성됨, G01은 확정
S.gen['G01']=true; S.conf['G01']=true; S.gen['G02']=true;

const $=s=>document.querySelector(s);
const chOf=id=>CH.find(c=>c.id===id);
const status=id=>S.conf[id]?'done':(S.gen[id]?'draft':'todo');
const pct=id=>{const c=chOf(id);return Math.round(S.filled[id].size/c.inputs.length*100)};
function toast(m){$('#toastMsg').textContent=m;$('#toast').classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>$('#toast').classList.remove('show'),2400)}

/* =====================================================================
   RENDER — NAV
   ===================================================================== */
function renderNav(){
  $('#chNav').innerHTML=CH.map(c=>{
    const st=status(c.id);
    return `<button class="ch-item ${S.view==='ch'&&S.ch===c.id?'on':''}" data-ch="${c.id}">
      <span class="ch-id">${c.id}</span>
      <span class="ch-nm">${c.nm}</span>
      <span class="dot ${st==='done'?'done':st==='draft'?'draft':''}"></span>
    </button>`;}).join('');
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('on',S.view===b.dataset.view));
  $('#chNav').querySelectorAll('.ch-item').forEach(b=>b.onclick=()=>{S.ch=b.dataset.ch;S.step=S.gen[S.ch]?2:1;S.view='ch';S.actEv=null;render()});
}

   ===================================================================== */

          ${CH.map(c=>{const st=status(c.id),p=pct(c.id);return `<tr style="cursor:pointer" data-goch="${c.id}">

function vCh(){
  const c=chOf(S.ch);
  const p=pct(c.id), req=c.inputs.filter(i=>i.r).length;
  const reqDone=c.inputs.filter((i,idx)=>i.r&&S.filled[c.id].has(idx)).length;
  const canGen=reqDone===req;
  const st=status(c.id);

  const stepper=`<div class="steps">
    <button class="step ${S.step===1?'on':''} ${p===100?'done':''}" data-step="1"><span class="step-n">${p===100?'✓':'1'}</span><span><span class="step-t">정보 올리기</span><span class="step-d">${S.filled[c.id].size}/${c.inputs.length}개 수집</span></span></button>
    <span class="step-sep"></span>
    <button class="step ${S.step===2?'on':''} ${S.gen[c.id]?'done':''}" data-step="2"><span class="step-n">${S.gen[c.id]?'✓':'2'}</span><span><span class="step-t">초안 확인</span><span class="step-d">${S.gen[c.id]?'생성 완료':'대기'}</span></span></button>
    <span class="step-sep"></span>
    <button class="step ${S.step===3?'on':''} ${S.conf[c.id]?'done':''}" data-step="3"><span class="step-n">${S.conf[c.id]?'✓':'3'}</span><span><span class="step-t">검토·확정</span><span class="step-d">${S.conf[c.id]?'확정됨':'미확정'}</span></span></button>
  </div>`;

  const head=`<div class="eyebrow">${c.id} · 지주 제출본 제${c.id.slice(2)}장</div>
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px">
      <div><h1>${c.nm}</h1><p class="lede">${c.desc}</p></div>
      ${st==='done'?'<span class="tag n" style="flex:0 0 auto">확정</span>':st==='draft'?'<span class="tag c" style="flex:0 0 auto">검토중</span>':'<span class="tag g" style="flex:0 0 auto">대기</span>'}
    </div>`;

  let body='';
  if(S.step===1) body=step1(c,canGen,req,reqDone);
  else if(S.step===2) body=S.gen[c.id]?step2(c):`<div class="card pad" style="text-align:center;padding:50px"><p style="color:var(--ink-3);font-size:13px">아직 초안이 없습니다. 1단계에서 정보를 올린 뒤 <b>초안 만들기</b>를 실행하세요.</p><button class="btn pri" style="margin-top:14px" data-step="1">1단계로 이동</button></div>`;
  else body=step3(c);

  return `<div class="wrap ${S.step===2?'wide':''}">${head}<div style="margin-top:20px">${stepper}</div>${body}</div>`;
}

function step1(c,canGen,req,reqDone){
  return `<div class="card">
    <div style="padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;background:var(--surface-2)">
      <div><h2>이 장에 필요한 정보</h2><p style="font-size:11.5px;color:var(--ink-3);margin-top:2px">필수 ${req}개 중 ${reqDone}개 수집 · 오른쪽 값은 전년 제출본 기준</p></div>
      <div style="width:150px"><div class="bar"><i class="${pct(c.id)===100?'ok':''}" style="width:${pct(c.id)}%"></i></div></div>
    </div>
    ${c.inputs.map((it,i)=>{
      const has=S.filled[c.id].has(i);
      return `<div class="inrow ${has?'filled':''}">
        <div>
          <div class="in-name">${it.n} ${it.r?'<span class="req">*</span>':'<span class="tag g">선택</span>'}</div>
          <div class="in-meta"><span class="src">출처 ${it.s}</span><span class="tag g">갱신 ${it.c}</span>${has?`<span class="filechip">${it.t==='file'?'▣ '+it.f:'✎ 입력됨'}</span>`:''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px">
          <span class="prev">전년 ${it.pv}</span>
          ${it.t==='file'
            ? (has?`<button class="btn gho sm" data-clear="${i}">교체</button>`:`<button class="btn pri sm" data-up="${i}">파일 올리기</button>`)
            : `<div class="valbox"><input value="${it.v||''}" data-val="${i}" placeholder="입력"><span class="unit">${it.u||''}</span></div>`}
        </div>
      </div>`}).join('')}
    <div style="padding:18px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-top:1px solid var(--line);background:var(--surface-2)">
      <div style="font-size:12px;color:var(--ink-2)">${canGen?'필수 정보가 모두 준비됐습니다. 5개년 학습본과 대조해 갱신 초안을 만듭니다.':`필수 항목 ${req-reqDone}개가 남았습니다.`}</div>
      <button class="btn pri" id="genBtn" ${canGen?'':'disabled'}>${S.gen[c.id]?'초안 다시 만들기':'초안 만들기'} →</button>
    </div>
  </div>`;
}

function renderP(p){
  const body=p.x.replace(/<D e="(e\d+)" k="(\w+)">/g,(m,e,k)=>`<span class="d d-${k==='new'?'new':k==='chg'?'chg':'same'} ${S.actEv===e?'act':''}" data-ev="${e}">`).replace(/<\/D>/g,'</span>');
  const cls=p.st==='new'?'pnew':p.st==='chg'?'pchg':'';
  const dim=S.onlyDiff&&p.st==='same'?'dimmed':'';
  const mark=p.st==='new'?'NEW':p.st==='chg'?'MOD':'';
  return `<div class="p ${cls} ${dim}"><span class="gut" style="color:${p.st==='new'?'var(--new)':p.st==='chg'?'var(--chg)':'var(--ink-3)'}">${mark}</span><span class="sub">${p.h}</span>${body}</div>`;
}

function step2(c){
  const nNew=c.draft.filter(p=>p.st==='new').length, nChg=c.draft.filter(p=>p.st==='chg').length;
  const tbl=c.id==='G02'?`<table class="doc-tbl"><caption>[표 2-8] 2026 1Q 기준 업권별 시장점유율 및 임계치 판정</caption>
    <thead><tr><th>자회사</th><th>업권</th><th>대표지표</th><th class="num">점유율</th><th class="num">임계치</th><th>판정</th></tr></thead><tbody>
    <tr><td><b>우리카드</b></td><td>신용카드업</td><td class="mono">이용실적</td><td class="num"><span class="d d-chg" data-ev="e6">8.29%</span></td><td class="num">10.0%</td><td><span class="tag g">미달</span></td></tr>
    <tr><td><b>우리금융캐피탈</b></td><td>리스·할부</td><td class="mono">총자산</td><td class="num"><span class="d d-chg" data-ev="e7">5.36%</span></td><td class="num">5.0%</td><td><span class="tag n">충족</span></td></tr>
    <tr><td><b>동양생명</b></td><td>생명보험업</td><td class="mono">총자산</td><td class="num"><span class="d d-new" data-ev="e8">3.56%</span></td><td class="num">5.0%</td><td><span class="tag g">미달</span></td></tr>
    <tr><td><b>ABL생명</b></td><td>생명보험업</td><td class="mono">총자산</td><td class="num"><span class="d d-new" data-ev="e8">1.98%</span></td><td class="num">5.0%</td><td><span class="tag g">미달</span></td></tr>
    </tbody></table>`:'';

  let docBody=''; c.draft.forEach((p,i)=>{ docBody+=renderP(p); if(p.tbl) docBody+=tbl; });

  return `<div class="docwrap">
    <div class="doc">
      <div class="doc-bar">
        <span class="tag n">신규 ${nNew}</span><span class="tag c">변경 ${nChg}</span><span class="tag g">유지 ${c.draft.length-nNew-nChg}</span>
        <span class="src" style="margin-left:4px">5개년 학습본 대조 · 생성 2026.08.16 09:41</span>
        <div class="spacer" style="flex:1"></div>
        <button class="btn gho sm" id="onlyDiff">${S.onlyDiff?'전체 보기':'변경만 보기'}</button>
        <button class="btn gho sm" onclick="toast('편집 모드는 데모에서 제공되지 않습니다')">직접 편집</button>
      </div>
      <div class="doc-body">
        <div class="doc-title">제${c.id.slice(2)}장 ${c.nm}</div>
        ${docBody}
      </div>
    </div>
    <div class="ev">${evPanel()}</div>
  </div>
  <div style="display:flex;justify-content:flex-end;gap:9px;margin-top:16px">
    <button class="btn gho" data-step="1">← 정보 수정</button>
    <button class="btn pri" data-step="3">검토·확정으로 →</button>
  </div>`;
}

function evPanel(){
  if(!S.actEv) return `<div class="ev-h"><div><div class="t">근거 원장</div><div class="s">EVIDENCE LEDGER</div></div></div>
    <div class="ev-b"><div class="ev-empty"><div class="big">◎</div>본문에서 <b>색이 칠해진 부분</b>을 누르면<br>그 문장이 어떤 값에서 나왔는지,<br>전년과 무엇이 달라졌는지 보여줍니다.</div></div>`;
  const e=EV[S.actEv];
  return `<div class="ev-h"><div><div class="t">${e.t}</div><div class="s">${S.actEv.toUpperCase()} · ${e.conf}</div></div>${e.conf==='확정'?'<span class="tag n">확정</span>':'<span class="tag d">검증필요</span>'}</div>
  <div class="ev-b">
    <div class="ev-k" style="margin-bottom:6px">전년 → 금년</div>
    <div class="delta"><span class="a">${e.pv}</span><span class="arw">▶</span><span class="b">${e.cv}</span></div>
    <div class="ev-row"><div class="ev-k">원천 데이터</div><div class="ev-v m">${e.src}</div></div>
    <div class="ev-row"><div class="ev-k">위치</div><div class="ev-v m">${e.loc}</div></div>
    <div class="ev-row"><div class="ev-k">적용 규칙</div><div class="ev-v">${e.rule}</div></div>
    <div class="ev-row"><div class="ev-k">변경 사유</div><div class="ev-v">${e.logic}</div></div>
    <div style="margin-top:14px"><div class="ev-k" style="margin-bottom:6px">데이터 계보</div>
    <div class="trace">${e.src}<br>&nbsp;└ ${e.loc}<br>&nbsp;&nbsp;&nbsp;└ 룰셋 ${ORGS[S.org].rs}<br>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;└ 본문 문장 생성</div></div>
    <div style="display:flex;gap:6px;margin-top:14px"><button class="btn gho sm" style="flex:1" onclick="toast('원천 파일 열기는 데모에서 제공되지 않습니다')">원천 열기</button><button class="btn gho sm" style="flex:1" onclick="toast('검토 의견이 기록되었습니다')">이의 제기</button></div>
  </div>`;
}

function step3(c){
  const items=[
    ['수치 정합성','본문 인용 수치가 원천 데이터와 일치하는지 확인'],
    ['논리 일관성','전년 대비 변경 사유가 본문에 서술되어 있는지 확인'],
    ['타 장 연계','다른 장에서 인용하는 값과 충돌이 없는지 확인'],
    ['감독당국 피드백','전년 보완요구 사항이 반영되었는지 확인'],
    ['미확정 항목','검증필요로 표시된 근거의 내부 확인 완료 여부']
  ];
  return `<div class="grid g2" style="align-items:start">
    <div class="card pad">
      <h2>검토 체크리스트</h2>
      <p style="font-size:11.5px;color:var(--ink-3);margin:3px 0 6px">모두 확인해야 확정할 수 있습니다.</p>
      ${items.map((it,i)=>`<div class="chk"><input type="checkbox" id="ck${i}" class="ckx" ${S.conf[c.id]?'checked':''}><label for="ck${i}"><b>${it[0]}</b><div class="h">${it[1]}</div></label></div>`).join('')}
      <div style="margin-top:14px"><div class="ev-k" style="margin-bottom:6px">검토 의견</div><textarea class="cmt" placeholder="예: 2.4절 우리금융캐피탈 판정 근거에 표 2-7 각주 인용 추가 필요">${S.conf[c.id]?'전년 대비 변경 4건 확인 완료. 표 2-8 각주 보완 후 확정.':''}</textarea></div>
      <div style="display:flex;gap:9px;margin-top:14px">
        <button class="btn gho" data-step="2">← 초안 보기</button>
        <button class="btn ${S.conf[c.id]?'gho':'pri'}" id="confBtn" style="flex:1">${S.conf[c.id]?'확정 해제':'이 장 확정하기'}</button>
      </div>
    </div>
    <div>
      <div class="card pad">
        <h2>승인 이력</h2>
        ${[['작성','정상화계획팀 백재웅','2026.08.16 09:41',1],['1차 검토','팀장 김OO',S.conf[c.id]?'2026.08.16 14:20':'대기',S.conf[c.id]?1:0],['부서 승인','그룹리스크관리부장','대기',0],['위원회 심의','리스크관리위원회','2026.05 예정',0]].map(r=>`
        <div style="display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)">
          <span class="dot ${r[3]?'done':''}" style="margin-top:6px;background:${r[3]?'#19C39C':'#D6DBE7'}"></span>
          <div style="flex:1"><div style="font-size:12.5px;font-weight:600">${r[0]}</div><div class="src">${r[1]}</div></div>
          <div class="src">${r[2]}</div></div>`).join('')}
      </div>
      <div class="card pad" style="margin-top:14px">
        <h2>이 장이 다른 장에 미치는 영향</h2>
        <p style="font-size:11.5px;color:var(--ink-3);margin:3px 0 10px">확정 시 아래 장의 인용값이 갱신됩니다.</p>
        ${(c.id==='G02'?[['G01','1.3 전년 대비 주요 변경사항','자회사 16개사'],['G05','5.3 조치 우선순위','중요자회사 목록'],['G07','7.3 자회사 자금이전 제약','대상 자회사']]:
           c.id==='G03'?[['G06','6.3 영향 및 회복 경로','위기 임계치 11.8%'],['G01','1.3 전년 대비 주요 변경사항','트리거 기준 변경']]:
           [['G01','1.3 전년 대비 주요 변경사항','장별 변경 요약']]).map(r=>`
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)">
          <span class="mono" style="font-size:11px;color:var(--ink-3);width:32px">${r[0]}</span>
          <span style="flex:1;font-size:12px">${r[1]}</span><span class="tag b">${r[2]}</span></div>`).join('')}
      </div>
    </div>
  </div>`;
}

/* =====================================================================
   GENERATION ANIMATION
   ===================================================================== */
function runGen(c){
  const lines=[
    `> 룰셋 로드 · ${ORGS[S.org].rs} (${ORGS[S.org].name})`,
    `> 과년도 제출본 조회 · FY2021~FY2025 중 제${c.id.slice(2)}장 5개 버전`,
    `> 전년 본문 구조 파싱 · ${c.draft.length}개 절 / 문장 단위 분해`,
    `> 신규 입력값 대조 · ${S.filled[c.id].size}개 항목`,
    `> 값 변동 감지 · ${c.draft.filter(p=>p.st!=='same').length}개 절에서 변경 확인`,
    `> 서술 재생성 · 변경 문장만 재작성, 유지 문장은 원문 보존`,
    `> 논리 정합성 검증 · 타 장 인용값 충돌 0건`,
    `> 근거 매핑 · 원천 파일 → 위치 → 규칙 → 문장 연결`,
    `✓ 초안 생성 완료`
  ];
  $('#view').innerHTML=`<div class="wrap"><div class="eyebrow">${c.id} · GENERATING</div><h1>초안을 만드는 중입니다</h1>
    <p class="lede">전년 본문을 그대로 두고, 값이 바뀐 문장만 다시 씁니다.</p>
    <div class="gen" id="genLog" style="margin-top:22px"></div>
    <div class="bar" style="margin-top:16px"><i id="genBar" style="width:0%"></i></div></div>`;
  const log=$('#genLog'); let i=0;
  const tick=()=>{
    if(i>=lines.length){ S.gen[c.id]=true; S.step=2; S.actEv=null; setTimeout(()=>{render();toast('초안이 만들어졌습니다')},420); return; }
    const d=document.createElement('div'); d.className='ln'+(i===lines.length-1?' ok':'');
    d.innerHTML=lines[i].replace(/·(.+)$/,'·<span class="hl">$1</span>');
    log.appendChild(d); $('#genBar').style.width=((i+1)/lines.length*100)+'%'; i++;
    setTimeout(tick, i===1?260:200+Math.random()*180);
  };
  setTimeout(tick,260);
}

/* =====================================================================
   RENDER + EVENTS
   ===================================================================== */
function render(){
  renderNav();
  const v=S.view;
  $('#view').innerHTML = v==='home'?vHome():v==='hub'?vHub():v==='rules'?vRules():v==='diff'?vDiff():v==='export'?vExport():vCh();
  $('#scroll').scrollTop=0;
  bind();
}

function bind(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.view=b.dataset.go;render()});
  document.querySelectorAll('[data-goch]').forEach(b=>b.onclick=()=>{S.ch=b.dataset.goch;S.step=S.gen[S.ch]?2:1;S.view='ch';render()});
  document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{S.step=+b.dataset.step;render()});
  document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.up, c=chOf(S.ch);
    S.filled[c.id].add(i); if(!c.inputs[i].f) c.inputs[i].f=c.inputs[i].n.split(' ')[0].replace(/[()]/g,'')+'_2026.xlsx';
    render(); toast('파일을 올렸습니다');
  });
  document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{toast('새 파일로 교체하면 초안이 재생성 대상이 됩니다')});
  document.querySelectorAll('[data-val]').forEach(inp=>{
    inp.oninput=()=>{const i=+inp.dataset.val,c=chOf(S.ch);c.inputs[i].v=inp.value;
      if(inp.value.trim())S.filled[c.id].add(i);else S.filled[c.id].delete(i);
      const req=c.inputs.filter(x=>x.r).length, rd=c.inputs.filter((x,ix)=>x.r&&S.filled[c.id].has(ix)).length;
      const g=$('#genBtn'); if(g) g.disabled=(rd!==req);
    };
  });
  const gb=$('#genBtn'); if(gb) gb.onclick=()=>runGen(chOf(S.ch));
  const od=$('#onlyDiff'); if(od) od.onclick=()=>{S.onlyDiff=!S.onlyDiff;render()};
  document.querySelectorAll('.d').forEach(s=>s.onclick=()=>{
    S.actEv = S.actEv===s.dataset.ev ? null : s.dataset.ev;
    document.querySelectorAll('.d').forEach(x=>x.classList.toggle('act',x.dataset.ev===S.actEv&&S.actEv));
    const p=document.querySelector('.ev'); if(p) p.innerHTML=evPanel(); bindEv();
  });
  bindEv();
  const cb=$('#confBtn'); if(cb) cb.onclick=()=>{
    const c=chOf(S.ch);
    if(S.conf[c.id]){S.conf[c.id]=false;render();toast('확정을 해제했습니다');return}
    const all=[...document.querySelectorAll('.ckx')].every(x=>x.checked);
    if(!all){toast('체크리스트를 모두 확인해 주세요');return}
    S.conf[c.id]=true;render();toast(`${c.id} ${c.nm} — 확정했습니다`);
  };
}
function bindEv(){ /* 근거 패널 내 버튼은 인라인 onclick 사용 */ }

document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;S.actEv=null;render()});
$('#orgSel').onchange=e=>{
  S.org=e.target.value; const o=ORGS[S.org];
  $('#ruleChip').textContent='RULESET · '+o.rs;
  render(); toast(`${o.name} 룰셋으로 전환했습니다 — 생성된 초안은 재생성 대상입니다`);
};
render();
</script>
</body>
</html>
