// ── 수학 유틸 ──────────────────────────────────────────
function normCDF(x) {
  const t = 1 / (1 + 0.2316419 * Math.abs(x));
  const d = 0.3989423 * Math.exp(-x * x / 2);
  const p = d * t * (0.319382 + t * (-0.356564 + t * (1.781478 + t * (-1.821256 + t * 1.330274))));
  return x >= 0 ? 1 - p : p;
}
function normInv(p) {
  const c = [2.515517, 0.802853, 0.010328],
    d = [1.432788, 0.189269, 0.001308];
  const t = Math.sqrt(-2 * Math.log(p < 0.5 ? p : 1 - p));
  const n = t - (c[0] + t * (c[1] + t * c[2])) / (1 + t * (d[0] + t * (d[1] + t * d[2])));
  return p < 0.5 ? -n : n;
}
function calcIRB(type, pd, lgd, m = 2.5) {
  const p = pd / 100,
    l = lgd / 100;
  let r,
    ma = 1;
  if (type === 'mortgage') {
    r = 0.15;
  } else if (type === 'qrre') {
    r = 0.04;
  } else if (type === 'retail_other') {
    const F = (1 - Math.exp(-35 * p)) / (1 - Math.exp(-35));
    r = 0.03 * F + 0.16 * (1 - F);
  } else {
    const F = (1 - Math.exp(-50 * p)) / (1 - Math.exp(-50));
    r = 0.12 * F + 0.24 * (1 - F);
    const b = Math.pow(0.11852 - 0.05478 * Math.log(p), 2);
    ma = (1 + (m - 2.5) * b) / (1 - 1.5 * b);
  }
  const K = (l * normCDF(Math.sqrt(r / (1 - r)) * normInv(0.999) + normInv(p) / Math.sqrt(1 - r)) - p * l) * ma;
  const mul = type === 'mortgage' || type === 'qrre' || type === 'retail_other' ? 1.06 : 1.0;
  return {
    rw: Math.min(Math.max(K, 0) * 12.5 * mul * 100, 1250),
    r: r * 100,
    K: Math.max(K, 0) * 100,
    ma
  };
}

function parseAmt(s) {
  s = String(s).replace(/,/g, '').replace(/\s/g, '');
  if (s.includes('조')) {
    const m = s.match(/([\d.]+)조/);
    if (m) return parseFloat(m[1]) * 1e12;
  }
  if (s.includes('억')) {
    const m = s.match(/([\d.]+)억/);
    if (m) return parseFloat(m[1]) * 1e8;
  }
  if (s.includes('만')) {
    const m = s.match(/([\d.]+)만/);
    if (m) return parseFloat(m[1]) * 1e4;
  }
  return parseFloat(s);
}
function parsePct(s) {
  return parseFloat(String(s).replace('%', '').trim());
}
function fmt(n) {
  return '₩' + Math.round(n).toLocaleString('ko-KR');
}
function matchRating(low, key) {
  if (low.includes('aaa') || low.includes('aa')) return 'AAA~AA-';
  if (low.includes('a+') || low.match(/\ba\b/) && !low.includes('aa') && !low.includes('bbb')) return 'A+~A-';
  if (low.includes('bbb') && key === 'corporate') return 'BBB+~BB-';
  if (low.includes('bbb')) return 'BBB+~BBB-';
  if (low.includes('bb') && !low.includes('bbb')) return key === 'corporate' ? 'BBB+~BB-' : 'BB+~B-';
  if (low.match(/\bb\b/) && !low.includes('bb') && !low.includes('bbb')) return 'B-미만';
  if (low.includes('미평가') || low.includes('무등급') || low.includes('없') || low.includes('unrat')) return '미평가';
  return null;
}

      } else if (no) {

  // ── SA 계산 ──────────────────────────────────
  function finishSA(c) {
    let ead = c.ead,
      rw = c.baseRW,
      detail = '';
    if (c.crmType && c.crmType !== 'guarantee' && c.crmValue) {
      const hc = {
        cash: 0,
        bond: 0.005,
        equity_col: 0.15,
        residential: 0
      }[c.crmType] ?? 0;
      const adjC = c.crmValue * (1 - hc);
      const adjEAD = Math.max(ead - adjC, ead * 0.1);
      detail += `담보액: ${fmt(c.crmValue)}  (헤어컷 후 ${fmt(adjC)})\n조정 EAD: ${fmt(adjEAD)}\n`;
      ead = adjEAD;
    }
    let rwa;
    if (c.crmType === 'guarantee' && c.guarAmt) {
      const g = Math.min(c.guarAmt, ead),
        orig = ead - g;
      rwa = orig * rw / 100 + g * (c.guarRW || 100) / 100;
      detail += `보증금액: ${fmt(g)}  보증인 가중치: ${c.guarRW}%\n`;
    } else {
      rwa = ead * rw / 100;
    }
    showResult({
      ...c,
